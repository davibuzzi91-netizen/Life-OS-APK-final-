name: Gerar APK do LifeOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar arquivo do projeto
        run: test -f LifeOS-Android-source.zip

      - name: Extrair projeto Android
        run: unzip -q LifeOS-Android-source.zip -d projeto

      - name: Instalar módulo Android do Capacitor
        working-directory: projeto
        run: |
          npm init -y
          npm install --no-save @capacitor/android@7.4.3 @capacitor/core@7.4.3

      - name: Gerar APK
        working-directory: projeto/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-APK
          path: projeto/android/app/build/outputs/apk/debug/app-debug.apk
